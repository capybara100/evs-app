/**
 * First-open onboarding: Watt's clickable introduction, which doubles as the
 * consent flow (spec section 7).
 *
 * Both Report 1 and Report 6 list this as missing. It is the first thing a
 * real tenant sees, and the only place consent is actually given.
 *
 * Rendering is a pure function of (index, state, lang) so it can be tested
 * without a DOM. mount() adds the event wiring.
 */



const ONBOARDING_LABELS = {
  next: { nl: 'Verder', en: 'Next' },
  back: { nl: 'Terug', en: 'Back' },
  start: { nl: 'Beginnen', en: 'Get started' },
  connect: { nl: 'Meter koppelen', en: 'Connect meter' },
  skip: { nl: 'Overslaan', en: 'Skip' },
  step: { nl: 'Stap {n} van {total}', en: 'Step {n} of {total}' },
  // Feedback note §3.2: "keeps working" was too absolute. Say what stops.
  noBlocking: {
    nl: 'Je kiest altijd zelf. Zonder meterstanden blijven de algemene tips werken, maar je verbruik en je besparing kunnen we dan niet berekenen.',
    en: 'You always choose. Without meter data the general tips keep working, but we cannot calculate your consumption or your savings.',
  },
};

const onboardingLabel = (key, lang) => ONBOARDING_LABELS[key][lang] ?? ONBOARDING_LABELS[key].nl;

/** Progress dots. Communicates length up front, which reduces drop-off. */
function progress(index, lang) {
  const dots = INTRO_STEPS
    .map((_, i) => `<span class="dot${i <= index ? ' on' : ''}"></span>`)
    .join('');
  const text = onboardingLabel('step', lang)
    .replace('{n}', index + 1)
    .replace('{total}', TOTAL_INTRO_STEPS);
  return `<div class="progress"><div class="dots">${dots}</div>
    <p class="step-count">${text}</p></div>`;
}

/**
 * The consent step: every item separately refusable, each defaulting to off.
 * Nothing here may block continuing (handover Q10).
 */
function consentControls(state, lang) {
  const rows = CONSENT_ITEMS.map((item) => `
    <label class="consent-row">
      <input type="checkbox" data-consent="${item.key}"
             ${hasConsent(state, item.key) ? 'checked' : ''}>
      <span>${item[lang] ?? item.nl}</span>
    </label>`).join('');
  return `<div class="consent">${rows}
    <p class="reassure">${onboardingLabel('noBlocking', lang)}</p></div>`;
}

/**
 * The language choice, as the first question.
 *
 * Both options are written in their own language rather than translated, so
 * neither depends on the reader already understanding the other. The currently
 * selected one is marked, because the app has to open in something.
 */
function languageControls(lang) {
  const option = (id, label, note) =>
    `<button class="lang-option${id === lang ? ' on' : ''}" data-lang="${id}"
             lang="${id}"${id === lang ? ' aria-current="true"' : ''}>
      <strong>${label}</strong><span>${note}</span>
    </button>`;

  return `<div class="lang-choice">
    ${option('nl', 'Nederlands', 'Doorgaan in het Nederlands')}
    ${option('en', 'English', 'Continue in English')}
  </div>`;
}

/** A simulated meter connection. No real P4 exists; the copy says so. */
function meterControls(lang) {
  return `<div class="meter">
    <button class="btn" data-action="connect">${onboardingLabel('connect', lang)}</button>
    <p class="reassure">${lang === 'en'
      ? 'Simulated for this demonstrator. No real meter is contacted.'
      : 'Nagebootst voor deze demo. Er wordt geen echte meter benaderd.'}</p>
  </div>`;
}

/** Floors, worded the way a resident would say them rather than as a number. */
const FLOORS = Object.freeze([
  Object.freeze({ value: 0, nl: 'Begane grond', en: 'Ground floor' }),
  Object.freeze({ value: 1, nl: '1e verdieping', en: 'First floor' }),
  Object.freeze({ value: 2, nl: '2e verdieping', en: 'Second floor' }),
  Object.freeze({ value: 3, nl: '3e of hoger', en: 'Third or higher' }),
]);

/** Build periods rather than a year: nobody knows when their block went up. */
const BUILD_PERIODS = Object.freeze([
  Object.freeze({ value: 'voor-1975', nl: 'Voor 1975', en: 'Before 1975' }),
  Object.freeze({ value: '1975-1990', nl: '1975 tot 1990', en: '1975 to 1990' }),
  Object.freeze({ value: '1991-2005', nl: '1991 tot 2005', en: '1991 to 2005' }),
  Object.freeze({ value: 'na-2005', nl: 'Na 2005', en: 'After 2005' }),
  Object.freeze({ value: 'onbekend', nl: 'Weet ik niet', en: 'I do not know' }),
]);

/** These two are text; everything else about the home is a number. */
const TEXT_FIELDS = Object.freeze(['postcode', 'buildPeriod']);

/** A postcode area is exactly four digits; anything else is a typing slip. */
function isPostcodeArea(value) {
  return /^\d{4}$/.test(String(value ?? '').trim());
}

/**
 * The questions about the home, on one screen.
 *
 * The group asked for location, rooms, age and floor, and in the same breath
 * asked not to make the flow extensive. So they share a single step, and every
 * one is a tap on a pre-filled choice rather than something to type - except
 * the postcode, which is four digits.
 *
 * "Weet ik niet" is a real answer to the age question. Forcing a guess would
 * put worse data in than admitting the gap.
 */
function homeControls(state, lang, errors = {}) {
  // Read straight from state - no local fallback - so what is shown is always
  // what is stored, even if the tenant never touches these controls.
  const { postcode, rooms, floor, buildPeriod, occupants } = state.home;
  const options = (list, selected) => list.map((o) =>
    `<option value="${o.value}"${o.value === selected ? ' selected' : ''}>${o[lang] ?? o.nl}</option>`).join('');
  const numbers = (values, selected) => values.map((v) =>
    `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`).join('');

  return `<div class="home-details">
    <label class="field"><span>${lang === 'en' ? 'Postcode area (4 digits)' : 'Postcodegebied (4 cijfers)'}</span>
      <input type="text" inputmode="numeric" maxlength="4" size="4"
             data-home="postcode" value="${postcode}"${errors.postcode ? ' aria-invalid="true"' : ''}></label>
    ${errors.postcode ? `<p class="field-error" role="alert">${lang === 'en'
      ? 'Enter the four digits of your postcode, for example 6413.'
      : 'Vul de vier cijfers van je postcode in, bijvoorbeeld 6413.'}</p>` : ''}
    <label class="field"><span>${lang === 'en' ? 'Rooms' : 'Aantal kamers'}</span>
      <select data-home="rooms">${numbers([1, 2, 3, 4, 5, 6], rooms)}</select></label>
    <label class="field"><span>${lang === 'en' ? 'Which floor' : 'Welke verdieping'}</span>
      <select data-home="floor">${options(FLOORS, floor)}</select></label>
    <label class="field"><span>${lang === 'en' ? 'How old is it' : 'Hoe oud is de woning'}</span>
      <select data-home="buildPeriod">${options(BUILD_PERIODS, buildPeriod)}</select></label>
    <label class="field"><span>${lang === 'en' ? 'People living here' : 'Aantal bewoners'}</span>
      <select data-home="occupants">${numbers([1, 2, 3, 4], occupants)}</select></label>
  </div>`;
}

/** Full markup for one onboarding step. Pure - no DOM access. */
function renderOnboarding(index, state, lang = 'nl', errors = {}) {
  const step = introStep(index);
  const i = INTRO_STEPS.indexOf(step);
  const isLast = i === TOTAL_INTRO_STEPS - 1;

  let controls = '';
  if (step.kind === 'language') controls = languageControls(lang);
  else if (step.kind === 'consent') controls = consentControls(state, lang);
  else if (step.kind === 'meter') controls = meterControls(lang);
  else if (step.kind === 'home') controls = homeControls(state, lang, errors);

  return `<section class="onboarding" data-step="${step.id}" data-index="${i}">
    ${progress(i, lang)}
    <div class="watt">${batterySvg(
      step.kind === 'consent' || step.kind === 'meter' || step.kind === 'home'
        ? 'thinking' : 'happy')}</div>
    <h2>${step[lang].title}</h2>
    <p class="body">${step[lang].body}</p>
    ${controls}
    <div class="actions">
      ${i > 0 ? `<button class="btn ghost" data-action="back">${onboardingLabel('back', lang)}</button>` : ''}
      <button class="btn" data-action="${isLast ? 'finish' : 'next'}">
        ${isLast ? onboardingLabel('start', lang) : onboardingLabel('next', lang)}
      </button>
    </div>
  </section>`;
}

/**
 * Wires the flow into a container.
 * `onFinish(state)` receives the state with consent and home details applied.
 */
function mountOnboarding(container, initialState, lang, onFinish) {
  let index = 0;
  let state = initialState;
  let errors = {};
  // `lang` may be a function, so the header's NL/EN switch can re-render this
  // step in place. It has to: this is the first screen anyone sees, and until
  // they are through it there is no Profile screen to change the language on.
  const language = () => (typeof lang === 'function' ? lang() : lang);

  function draw() {
    container.innerHTML = renderOnboarding(index, state, language(), errors);
  }

  container.addEventListener('change', (event) => {
    const consentKey = event.target.dataset?.consent;
    if (consentKey) state = setConsent(state, consentKey, event.target.checked);

    const homeKey = event.target.dataset?.home;
    if (homeKey) {
      // Postcode and build period are text; coercing them with Number() would
      // store NaN and quietly blank the field on the next render.
      const raw = event.target.value;
      const value = TEXT_FIELDS.includes(homeKey) ? raw.trim() : Number(raw);
      state = { ...state, home: { ...state.home, [homeKey]: value } };
      if (homeKey === 'postcode' && errors.postcode && isPostcodeArea(value)) { errors = {}; draw(); }
    }
  });

  container.addEventListener('click', (event) => {
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (!action) return;
    if (action === 'next') { index = Math.min(TOTAL_INTRO_STEPS - 1, index + 1); draw(); }
    else if (action === 'back') { index = Math.max(0, index - 1); draw(); }
    else if (action === 'connect') { event.target.textContent = language() === 'en' ? 'Connected' : 'Gekoppeld'; }
    else if (action === 'finish') {
      // A slip in the one typed field is caught here, with a sentence under the
      // field, rather than stored and quietly shown as the "postcode area".
      if (!isPostcodeArea(state.home.postcode)) {
        errors = { postcode: true };
        draw();
        container.querySelector('[data-home="postcode"]')?.focus();
        return;
      }
      onFinish({ ...state, onboarded: true });
    }
  });

  draw();
  return { draw };
}

/**
 * The consent journey as a resident would meet it, run from inside the app.
 *
 * It no longer sits in front of the demonstration (feedback note §2): the
 * menu's "resident app" entry lands on the home screen, and this is reached
 * from Profile by whoever wants to see how a resident signs up.
 *
 * Mounted into its own wrapper so its listeners die with it. Mounting twice
 * into the same container would otherwise stack two click handlers, and every
 * "Verder" would advance two steps.
 *
 * On finish, only the fields the journey owns are merged onto current state.
 * Writing the whole captured object back would undo anything changed since it
 * mounted - the language, for one.
 */
function mountConsentJourney(container, store, onDone) {
  const wrapper = document.createElement('div');
  container.innerHTML = '';
  container.appendChild(wrapper);

  const view = mountOnboarding(wrapper, store.get(), () => store.get().language, (next) => {
    store.set(mergeJourneyResult(store.get(), next));
    onDone();
  });
  return view;
}

/**
 * What the journey may write back: consent, the home answers, and the fact
 * that it was completed. Nothing else - it captured `current` when it mounted,
 * and anything changed since (the language, for one) must survive it.
 */
function mergeJourneyResult(current, next) {
  return { ...current, consent: next.consent, home: next.home, onboarded: true };
}

/**
 * The growth ladder: every stage of the tree, side by side.
 *
 * The demonstrator brief lists "Goals" as a drawer entry (Report 5's levels
 * and rewards overview) and it was the last one missing. It also answers the
 * obvious question the home screen raises and never resolves - what does the
 * tree actually turn into? - which no single-stage mascot can show.
 *
 * Reached stages are drawn in full colour, the rest greyed but still visible:
 * hiding them would remove the thing the whole ladder is for.
 *
 * Pure function of (app, state, lang), like every other screen.
 */





function renderLevels(app, state, lang) {
  const reachedLevel = app.stage.level;

  const rungs = LEVELS.map((rung) => {
    const reached = rung.level <= reachedLevel;
    const current = rung.level === reachedLevel;
    const name = rung[lang] || rung.nl;

    const status = current
      ? say('Hier sta je nu', 'You are here now', lang)
      : reached
        ? say('Gehaald', 'Reached', lang)
        : say('Vanaf ' + euro(rung.threshold), 'From ' + euro(rung.threshold), lang);

    return '<li class="rung' + (reached ? ' reached' : '') + (current ? ' current' : '') + '"'
      + ' data-level="' + rung.level + '">'
      + treeSvg(rung.level, name, { health: 'healthy' })
      + '<div class="rung-text">'
      + '<strong>' + rung.level + '. ' + name + '</strong>'
      + '<span class="rung-status">' + status + '</span>'
      + '</div></li>';
  }).join('');

  // Each rung costs more than the one before it, which is the point: the first
  // stage should arrive quickly and the last should feel earned.
  const gaps = LEVELS.slice(1).map((rung, i) =>
    Math.round((rung.threshold - LEVELS[i].threshold) * 100) / 100);

  return '<h2>' + say('Je boom', 'Your tree', lang) + '</h2>'
    + '<p class="note">' + say(
      'Zes stappen. Elke stap kost meer dan de vorige, dus de eerste gaat snel en de laatste voelt verdiend.',
      'Six stages. Each one costs more than the last, so the first arrives quickly and the last feels earned.', lang)
    + '</p>'

/**
 * A notes panel beside the phone, for whoever is showing the demo.
 *
 * Typed text is kept in localStorage, so it survives closing the tab and
 * coming back. Two honest limits, stated on the panel itself rather than
 * discovered later:
 *
 *  - it is stored in THIS browser. Someone opening the same link on another
 *    laptop or phone sees an empty panel. Sharing notes between people needs a
 *    server, which this demonstrator deliberately does not have;
 *  - a browser blocking site data, or private browsing, may drop it. Every
 *    read and write is wrapped, so the panel still works as a scratch pad even
 *    when nothing can be saved.
 *
 * Its own storage key, separate from the app state, so clearing the demo with
 * "opnieuw beginnen" never wipes someone's notes.
 *
 * Hidden on narrow screens: on a phone there is no room beside the app, and
 * this is a presenter's tool rather than part of the product.
 */


const NOTES_KEY = 'evs.notes.v1';

/** Reads saved notes. Never throws - storage can be unavailable. */
function loadNotes(storage) {
  try {
    return storage.getItem(NOTES_KEY) ?? '';
  } catch {
    return '';
  }
}

/** Saves notes. Returns false when storage refused, rather than throwing. */
function saveNotes(storage, text) {
  try {
    storage.setItem(NOTES_KEY, text);
    return true;
  } catch {
    return false;
  }
}

/** Escapes text, so a stray tag in the notes cannot break the panel. */
function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderNotes(text, lang) {
  return '<h2 class="side-title">' + say('Notities', 'Notes', lang) + '</h2>'
    + '<p class="side-note">' + say(
      'Ruimte voor je eigen aantekeningen bij deze demo.',
      'Room for your own notes alongside this demo.', lang) + '</p>'
    + '<textarea class="notes-box" data-notes rows="10" aria-label="'
    + say('Notities', 'Notes', lang) + '" placeholder="' + say(
      'Typ hier&hellip;', 'Type here&hellip;', lang) + '">' + escapeHtml(text) + '</textarea>'
    + '<p class="side-note">' + say(
      'Wordt bewaard in deze browser, op dit apparaat. Iemand anders die de link opent, ziet zijn eigen lege blad.',
      'Saved in this browser, on this device. Anyone else opening the link gets their own blank page.', lang)
    + '</p>';
}

function renderHome(app, state, lang) {

  const event = chooseEventForAdvice(

  const underHeating = app.floorDays > 0;

  const advice = selectTipForEvent(
    event,

  if (advice) {

function renderSavings(app, state, lang) {
  const { readings, expectedSeries, floorDays } = app;

  // Monthly / seasonal / yearly, per the brief. The yearly figure is a
  // projection from measured days, and has to say so on screen: presenting an
  // extrapolation as a measurement is the exact failure the handover flags.
  const period = periodTotals(expectedSeries, readings, state.period);
  const chips = PERIODS.map((p) =>
    '<button class="chip' + (p.id === state.period ? ' on' : '') + '" data-period="' + p.id + '">'
    + (p[lang] || p.nl) + '</button>').join('');

  // "Season" is 45 days, not 90, and that surprises people. There ARE 90 days
  // of history: the first 45 teach the model what this home normally uses, and
  // a day cannot both set the expectation and be judged against it. Say so
  // where the number appears, rather than leaving it looking like a bug.
  const scope = period.measured
    ? say('over ' + period.days + ' gemeten dagen', 'over ' + period.days + ' measured days', lang)
    : say('geschat, niet gemeten', 'estimated, not measured', lang);

  const seasonNote = state.period === 'season' ? card(
    say('Waarom ' + period.days + ' dagen en niet 90?', 'Why ' + period.days + ' days and not 90?', lang),
    '<p class="note">' + say(
      'Er zijn 90 dagen aan meterstanden. De eerste ' + BASELINE_DAYS
        + ' gebruikt het model om te leren wat in jouw woning normaal is. Diezelfde dagen kunnen niet ook meetellen als besparing: je kunt de lat niet leggen en er tegelijk overheen springen. Daarom wordt er gemeten over de ' + period.days + ' dagen daarna.',
      'There are 90 days of meter readings. The model uses the first ' + BASELINE_DAYS
        + ' to learn what is normal for your home. Those same days cannot also count as saving: you cannot set the bar and clear it at the same time. So the measurement runs over the ' + period.days + ' days after that.', lang)
    + '</p>') : '';

  // A projection above the headline the reports themselves publish is the
  // failure the handover flags. Say it on the screen rather than hoping the
  // presenter notices.
  const overCeiling = !period.measured && period.net > ANNUAL_CEILING_EUR
    ? '<p>' + say(
        'Let op: dit ligt boven de ' + euro(ANNUAL_CEILING_EUR)
          + ' per jaar die rapport 4 als richtbedrag noemt. Dit huishouden bespaart in de simulatie bewust veel; een gemiddelde huurder komt lager uit.',
        'Note: this sits above the ' + euro(ANNUAL_CEILING_EUR)
          + ' a year report 4 gives as its headline. This simulated household saves deliberately hard; an average tenant lands lower.', lang)
      + '</p>' : '';

  const projection = period.measured ? '' : card(
    say('Dit is een schatting', 'This is an estimate', lang),
    '<p>' + say(
      'Doorgerekend vanaf ' + period.basedOnDays + ' gemeten dagen, over '
        + HEATING_DAYS_PER_YEAR + ' stookdagen per jaar. Buiten het stookseizoen valt er nauwelijks op verwarming te besparen, dus die dagen tellen hier niet mee.',
      'Scaled up from ' + period.basedOnDays + ' measured days across '
        + HEATING_DAYS_PER_YEAR + ' heating days a year. Outside the heating season there is barely any heating to save on, so those days are not counted here.', lang)
    + '</p>' + overCeiling, 'warn');

  const totals = '<div class="name-choices">' + chips + '</div>'
    + statRow(say('Minder gebruikt dan verwacht', 'Used less than expected', lang),
        euro(period.net), scope)
    + statRow(say('Telt mee voor je boom', 'Counts towards your tree', lang), euro(period.credited),
        say(floorDays + ' dagen telden niet mee', floorDays + ' days did not count', lang));

  const chartNote = say(
    'De band laat zien hoe zeker de verwachting is. Ligt je lijn eronder, dan gebruikte je echt minder dan het weer verklaart.',
    'The band shows how certain the expectation is. If your line sits below it, you genuinely used less than the weather explains.', lang);

  const fixed = say(
    'Ongeveer ' + pct(FIXED_COST_SHARE) + '% van je rekening is vastrecht en belasting. Daar verandert je gedrag niets aan. Alles hierboven gaat alleen over het deel dat je wel kunt beinvloeden.',
    'About ' + pct(FIXED_COST_SHARE) + '% of your bill is standing charges and tax. Your behaviour cannot change that. Everything above is only about the part you can influence.', lang);

  return '<h2>' + say('Besparing', 'Savings', lang) + '</h2>'
    + card('', totals)
    + projection
    + seasonNote
    + card(say('Jouw verbruik tegenover de verwachting', 'Your use against the expectation', lang),
        consumptionChart(readings, expectedSeries, lang) + '<p class="note">' + chartNote + '</p>')
    + card(say('Wat je niet kunt veranderen', 'What you cannot change', lang), '<p>' + fixed + '</p>');
}

    + '<section class="card"><h3>Daily electricity</h3><p class="evt-muted">Missing and partial readings appear as gaps and are excluded from detection. Gas events are marked by date on this shared timeline.</p><div id="evt-chart" class="evt-chart"><p class="evt-muted">No daily series loaded.</p></div><div id="evt-legend" class="evt-legend"></div></section>'
    + '<section class="card"><h3>Detected patterns</h3><div class="evt-table-wrap"><table class="evt-table"><thead><tr>'
    + '<th><button data-evt-sort="type">Type</button></th><th><button data-evt-sort="start">Time</button></th><th><button data-evt-sort="magnitude">Size</button></th><th><button data-evt-sort="confidence">Confidence</button></th></tr></thead><tbody id="evt-events"><tr><td colspan="4" class="evt-muted">No events loaded.</td></tr></tbody></table></div></section>'
    + '<section class="card"><h3>Test the detection rules</h3><p class="evt-evaluation-explainer"><strong>This is a developer check, not a household result.</strong><br>It runs the same rules on prepared examples where the expected synthetic changes are known. This helps us measure whether the rules find unusual use without confusing missing data for behaviour.</p><p class="evt-evaluation-meta"><strong>Fixture household:</strong> Klant 34 &middot; <strong>Scenarios:</strong> synthetic test files</p><div class="evt-controls"><label class="evt-control">Test case<select id="evt-scenario"><option value="high_use">High use: four injected gas increases</option><option value="normal">Normal use: no injected events</option><option value="missing">Missing data: gaps and partial readings</option><option value="incomplete">Short history: ten days only</option></select></label></div><button class="btn ghost evt-evaluate" id="evt-evaluate">Run test case for Klant 34</button><p id="evt-evaluation-source" class="evt-muted">No test case run yet.</p><div id="evt-metrics" class="evt-metric-grid"></div><div id="evt-quality" class="evt-quality"></div></section>'
    + '</section>';
}

function evtDate(value) {
  return value ? new Date(value).toLocaleString() : '-';
}

function evtLabel(type) {
  return { high_electricity: 'High electricity use', high_gas: 'High gas use' }[type] || type;
}

function evtPercent(value) {
  return Math.round(value * 100) + '%';
}

function evtRequest(container) {
  const value = (id) => container.querySelector('#' + id).value;
  return {
    dataset: value('evt-dataset'), household: value('evt-household'),
    range_start: value('evt-from') || null, range_end: value('evt-to') || null,
    module: value('evt-module'), method: 'rules', scenario: value('evt-scenario'),
  };
}

function evtDrawChart(chart, legend, points, events, selectedId) {
  if (!points.length) { chart.innerHTML = '<p class="evt-muted">No series loaded. Connect the data service to see the curve.</p>'; legend.innerHTML = ''; return; }
  const width = 640; const height = 180; const pad = 18;
  const values = points.map((p) => Number.isFinite(p.electricity_kwh) ? p.electricity_kwh : null);
  const numericValues = values.filter((v) => v !== null);
  if (!numericValues.length) { chart.innerHTML = '<p class="evt-muted">No valid electricity readings in this range.</p>'; legend.innerHTML = ''; return; }
  const max = Math.max(...numericValues, 1); const min = Math.min(...numericValues, 0);
  const x = (i) => pad + i * (width - pad * 2) / Math.max(1, points.length - 1);
  const y = (v) => height - pad - (v - min) * (height - pad * 2) / Math.max(1, max - min);
  let path = '';
  values.forEach((value, index) => {
    if (value === null) return;
    const previous = index > 0 ? values[index - 1] : null;
    path += (previous === null ? 'M' : 'L') + x(index).toFixed(1) + ' ' + y(value).toFixed(1) + ' ';
  });
  const markers = events.map((event) => {
    const index = points.findIndex((point) => new Date(point.timestamp) >= new Date(event.start));
    if (index < 0 || values[index] === null) return '';
    const color = EVT_COLORS[event.type] || '#4a5a50';
    const selected = event.id === selectedId;
    return '<circle cx="' + x(index).toFixed(1) + '" cy="' + y(values[index]).toFixed(1) + '" r="' + (selected ? 7 : 5) + '" fill="' + color + '" stroke="' + (selected ? '#1A1A1A' : '#fff') + '" stroke-width="2"><title>' + escapeHtml(event.type + ' ' + event.magnitude + ' ' + event.confidence) + '</title></circle>';
  }).join('');
  chart.innerHTML = '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Electricity load curve with detected events"><path d="' + path + '" fill="none" stroke="#1F4128" stroke-width="2" stroke-linejoin="round"/>' + markers + '</svg>';
  const types = [...new Set(events.map((event) => event.type))];
  legend.innerHTML = types.map((type) => '<span class="evt-key"><span class="evt-swatch" style="background:' + (EVT_COLORS[type] || '#4a5a50') + '"></span>' + escapeHtml(type) + '</span>').join('');
}

function mountEventDetection(container) {
  let points = []; let events = []; let selectedId = null; let sortBy = 'start'; let sortAscending = true;
  const status = container.querySelector('#evt-status');
  const chart = container.querySelector('#evt-chart');
  const legend = container.querySelector('#evt-legend');
  const table = container.querySelector('#evt-events');
  const setStatus = (text, warning = false) => { status.textContent = text; status.classList.toggle('warn', warning); };
  const loadHouseholds = async () => {
    const householdSelect = container.querySelector('#evt-household');
    try {
      const response = await fetch(EVT_API_BASE + '/datasets');
      if (!response.ok) throw new Error('Datasets HTTP ' + response.status);
      const datasets = await response.json();
      const dataset = datasets.find((item) => item.id === 'zonnedael');
      const households = dataset?.households || [];
      householdSelect.innerHTML = households.map((household) => '<option value="' + escapeHtml(household) + '">' + escapeHtml(household) + '</option>').join('');
      if (!households.length) throw new Error('No included households returned');
      householdSelect.value = households.includes('Klant 34') ? 'Klant 34' : households[0];
    } catch (error) {
      householdSelect.innerHTML = '<option value="Klant 34">Klant 34</option>';
      setStatus('Could not load the household list. Using Klant 34: ' + error.message, true);
    }
  };
  const draw = () => {
    const sorted = [...events].sort((a, b) => String(a[sortBy]).localeCompare(String(b[sortBy]), undefined, { numeric: true }) * (sortAscending ? 1 : -1));
    table.innerHTML = sorted.length ? sorted.map((event) => '<tr class="' + (event.id === selectedId ? 'evt-selected' : '') + '" data-evt-id="' + escapeHtml(event.id) + '"><td>' + escapeHtml(evtLabel(event.type)) + '</td><td>' + evtDate(event.start) + '</td><td>' + escapeHtml(String(event.magnitude)) + '</td><td>' + Math.round(event.confidence * 100) + '%</td></tr>').join('') : '<tr><td colspan="4" class="evt-muted">No unusual patterns detected.</td></tr>';
    evtDrawChart(chart, legend, points, events, selectedId);
  };
  const run = async (evaluate) => {
    setStatus('Loading event detection...');
    try {
      const request = evtRequest(container);
      // Evaluation always uses the prepared Klant 34 fixture.
      const evaluationRequest = evaluate
        ? Object.assign({}, request, { household: 'Klant 34' })
        : request;
      const query = new URLSearchParams({
        dataset: request.dataset,
        household: evaluationRequest.household,
      });
      if (evaluationRequest.range_start) query.set('range_start', evaluationRequest.range_start);
      if (evaluationRequest.range_end) query.set('range_end', evaluationRequest.range_end);
      const seriesResponse = await fetch(EVT_API_BASE + '/series?' + query.toString());
      if (!seriesResponse.ok) throw new Error('Series HTTP ' + seriesResponse.status);
      points = await seriesResponse.json();
      draw();
      // Detection and evaluation use the same selected date range.
      const endpoint = evaluate ? '/evaluate' : '/detect';
      const response = await fetch(EVT_API_BASE + endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(evaluationRequest) });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const result = await response.json();
      if (evaluate) {
        container.querySelector('#evt-evaluation-source').innerHTML = escapeHtml(result.source) + '<br><span class="evt-muted">Matching tolerance: +/- ' + result.tolerance_minutes + ' minutes.</span>';
        container.querySelector('#evt-metrics').innerHTML = result.metrics.length ? result.metrics.map((metric) => '<div class="evt-metric"><strong>' + escapeHtml(evtLabel(metric.event_type)) + '</strong><span>Precision: ' + evtPercent(metric.precision) + ' &middot; Recall: ' + evtPercent(metric.recall) + ' &middot; F1: ' + evtPercent(metric.f1) + '</span><span>Detected: ' + metric.detected + ' &middot; Synthetic expected: ' + metric.ground_truth + ' &middot; Matched: ' + metric.matched + '</span></div>').join('') : '<p class="evt-muted">No expected or detected events in this test case.</p>';
        container.querySelector('#evt-quality').innerHTML = result.data_quality.length ? '<p><strong>Data quality findings: ' + result.data_quality.length + '</strong></p><ul>' + result.data_quality.map((issue) => '<li>' + escapeHtml(issue.date.slice(0, 10) + ': ' + issue.status + ' - ' + issue.details) + '</li>').join('') + '</ul>' : '<p class="evt-muted">No missing or partial readings in this scenario.</p>';
      } else {
        events = result; detectedEventsForAdvice = result; selectedId = null; draw(); const qualityCount = points.filter((point) => point.quality_flag !== 'ok').length; setStatus(events.length ? events.length + ' patterns found across ' + points.length + ' daily readings.' + (qualityCount ? ' ' + qualityCount + ' incomplete readings excluded.' : '') : 'No unusual patterns found across ' + points.length + ' daily readings.' + (qualityCount ? ' ' + qualityCount + ' incomplete readings excluded.' : ''));
      }
    } catch (error) { setStatus('Backend offline or unavailable: ' + error.message, true); }
  };
  container.querySelector('#evt-run').addEventListener('click', () => run(false));
  container.querySelector('#evt-evaluate').addEventListener('click', () => run(true));
  container.addEventListener('click', (event) => {
    const sort = event.target.closest('[data-evt-sort]')?.dataset.evtSort;
    if (sort) { if (sortBy === sort) sortAscending = !sortAscending; else { sortBy = sort; sortAscending = true; } draw(); return; }
    const row = event.target.closest('[data-evt-id]');
    if (row) { selectedId = row.dataset.evtId; draw(); }
  });
  draw();
  loadHouseholds();
}

/**
 * The in-app guided tour.
 *
 * The tenant lands on the working app straight away; Watt then speaks from a
 * bubble anchored to each part of the screen in turn. This replaces the old
 * full-screen introduction, which put six pages of reading in front of an app
 * nobody had seen yet.
 *
 * The app underneath stays visible and is never covered, only dimmed, so the
 * thing being described is always in view.
 */


const TOUR_LABELS = {
  next: { nl: 'Verder', en: 'Next' },
  back: { nl: 'Terug', en: 'Back' },
  done: { nl: 'Ik snap het', en: 'Got it' },
  skip: { nl: 'Sla uitleg over', en: 'Skip the tour' },
  counter: { nl: '{n} van {total}', en: '{n} of {total}' },
};
const tourLabel = (key, lang) => TOUR_LABELS[key][lang] || TOUR_LABELS[key].nl;

/** Room beside the phone needed before the bubble will sit there. */
const SIDE_BUBBLE_MIN_PX = 360;

/** The notes panel, when it is on screen. Never covered, never blocked. */
function notesBox(stage) {
  const el = stage.querySelector('#side');
  if (!el) return null;
  return getComputedStyle(el).display === 'none' ? null : el.getBoundingClientRect();
}

/**
 * Places the bubble near its anchor.
 *
 * On a laptop the bubble sits BESIDE the phone rather than on top of it. Over
 * the phone it hid the very screen it was describing, which is the opposite of
 * what a walkthrough is for. On a narrow screen there is nowhere to put it but
 * over the app, so it keeps the old behaviour there.
 */
function position(bubble, anchorEl, stage) {
  const pad = 12;
  const box = stage.getBoundingClientRect();
  const phoneEl = stage.querySelector('#phone');
  const phone = phoneEl ? phoneEl.getBoundingClientRect() : box;
  // Whoever is running the demo wants to take notes while Watt talks, so the
  // bubble goes on whichever side does not reach the notes panel. Right is
  // preferred; when the notes are there, left is what is left.
  const notes = notesBox(stage);
  const roomRight = (notes ? notes.left : box.right) - phone.right;
  const roomLeft = phone.left - box.left;

  const verticalTop = () => {
    const anchorTop = anchorEl
      ? anchorEl.getBoundingClientRect().top - box.top - 16
      : phone.top - box.top + 90;
    const lowest = Math.max(pad, box.height - bubble.offsetHeight - pad);
    return Math.min(Math.max(pad, anchorTop), lowest) + 'px';
  };

  if (roomRight >= SIDE_BUBBLE_MIN_PX) {
    bubble.dataset.side = 'true';
    bubble.style.left = (phone.right - box.left + 24) + 'px';
    bubble.style.top = verticalTop();
    return;
  }
  if (roomLeft >= SIDE_BUBBLE_MIN_PX) {
    bubble.dataset.side = 'true';
    bubble.style.left = (phone.left - box.left - bubble.offsetWidth - 24) + 'px';
    bubble.style.top = verticalTop();
    return;
  }

  bubble.dataset.side = 'false';
  const left = phone.left - box.left + pad;
  bubble.style.left = left + 'px';

  if (!anchorEl) {
    bubble.style.top = (phone.top - box.top + phone.height / 2 - bubble.offsetHeight / 2) + 'px';
    return;
  }

  const a = anchorEl.getBoundingClientRect();
  const below = a.bottom - box.top + pad;
  const above = a.top - box.top - bubble.offsetHeight - pad;
  // Prefer below the anchor; flip above when there is not enough room.
  const fits = below + bubble.offsetHeight < phone.bottom - box.top;
  bubble.style.top = (fits ? below : Math.max(pad, above)) + 'px';
}

/**
 * The dim covers the phone and nothing else.
 *
 * It used to cover the whole stage, which greyed out the notes panel and -
 * because the layer sits above everything - swallowed clicks meant for it. You
 * could neither read nor type your notes while Watt was talking.
 */
function dimThePhoneOnly(dim, stage) {
  const box = stage.getBoundingClientRect();
  const phoneEl = stage.querySelector('#phone');
  const p = phoneEl ? phoneEl.getBoundingClientRect() : box;
  dim.style.left = (p.left - box.left) + 'px';
  dim.style.top = (p.top - box.top) + 'px';
  dim.style.width = p.width + 'px';
  dim.style.height = p.height + 'px';
}

/** Draws a ring around the element being described. */
function highlight(ring, anchorEl, stage) {
  if (!anchorEl) { ring.style.display = 'none'; return; }
  const box = stage.getBoundingClientRect();
  const a = anchorEl.getBoundingClientRect();
  ring.style.display = 'block';
  ring.style.top = (a.top - box.top - 6) + 'px';
  ring.style.left = (a.left - box.left - 6) + 'px';
  ring.style.width = (a.width + 12) + 'px';
  ring.style.height = (a.height + 12) + 'px';
}

/**
 * Runs the tour inside `stage` (the phone frame).
 * `onDone` fires whether the tenant finishes or skips - skipping is not a
 * failure state and must never be treated as one.
 */
function mountTour(stage, lang, onDone, controls = {}) {
  const { onScreen } = controls;
  let index = 0;
  let shownScreen = null;

  const layer = document.createElement('div');
  layer.className = 'tour-layer';
  layer.innerHTML = '<div class="tour-dim"></div><div class="tour-ring"></div>'
    + '<div class="tour-bubble" role="dialog" aria-live="polite"></div>';
  stage.appendChild(layer);
  stage.dataset.tourActive = 'on';

  const ring = layer.querySelector('.tour-ring');
  const bubble = layer.querySelector('.tour-bubble');

  function finish() {
    layer.remove();
    delete stage.dataset.tourActive;
    // Never leave someone stranded on whichever tab they skipped from.
    if (onScreen && shownScreen !== 'home') onScreen('home');
    onDone();
  }

  function draw() {
    const step = tourStep(index);
    const isLast = index === TOTAL_TOUR_STEPS - 1;

    // Open the screen this step is about, before measuring anything on it.
    // The tour layer hangs off the phone rather than the screen, so switching
    // tabs underneath it does not disturb the bubble.
    if (onScreen && step.screen && step.screen !== shownScreen) {
      onScreen(step.screen);
      shownScreen = step.screen;
    }
    const counter = tourLabel('counter', lang)
      .replace('{n}', index + 1).replace('{total}', TOTAL_TOUR_STEPS);

    bubble.innerHTML =
      '<div class="tour-watt">' + batterySvg(index === 0 ? 'happy' : 'thinking') + '</div>'
      + '<div class="tour-speech">'
      + '<p class="tour-title">' + step[lang].title + '</p>'
      + '<p class="tour-body">' + step[lang].body + '</p>'
      // Back as well as forward: a walkthrough you can only run one way makes
      // anyone who missed something sit through the whole thing again.
      + '<div class="tour-actions">'
      + (index > 0
        ? '<button class="btn ghost" data-tour="back">&lsaquo; ' + tourLabel('back', lang) + '</button>'
        : '')
      + '<button class="btn" data-tour="next">' + (isLast ? tourLabel('done', lang) : tourLabel('next', lang)) + '</button>'
      + '</div>'
      + '<button class="tour-skip" data-tour="skip">' + tourLabel('skip', lang) + '</button>'
      + '<p class="tour-counter">' + counter + '</p>'
      + '</div>';

    const anchorEl = step.anchor ? stage.querySelector(step.anchor) : null;
    dimThePhoneOnly(layer.querySelector('.tour-dim'), stage);
    highlight(ring, anchorEl, stage);
    position(bubble, anchorEl, stage);
  }

  layer.addEventListener('click', (event) => {
    const action = event.target.closest('[data-tour]')?.dataset.tour;
    if (!action) return;
    if (action === 'skip') { finish(); return; }
    if (action === 'back') {
      // shownScreen is cleared so stepping back re-opens that step's screen.
      index = Math.max(0, index - 1);
      shownScreen = null;
      draw();
      return;
    }
    if (index >= TOTAL_TOUR_STEPS - 1) { finish(); return; }
    index += 1;
    draw();
  });

  draw();
  return { close: finish, name: ASSISTANT_NAME };
}

/**
 * Application bootstrap and tab router.
 *
 * Composes the engine over the simulated history, then renders whichever tab
 * is active. First open goes through Watt's introduction instead, which is
 * also the only place consent is given.
 */


















function boot(profileId) {
  // The model learns from the baseline window and is measured only on the
  // report window after it. Fitting and measuring the same days would force
  // the net saving to exactly zero. See BASELINE_DAYS in engine/model.js.
  const { baseline, report } = splitBaseline(generateHistory(profileId));
  const model = fitModel(baseline);
  const expectedSeries = report.map((r) => expectedFor(model, r));

  const cumulative = treeProgress(expectedSeries, report);
  // Per-day net, kept so the notification and tip history can report what each
  // day actually did rather than repeating the running total.
  const netByDay = report.map((r, i) => netSaving(expectedSeries[i], r));
  const rawNet = netByDay.reduce((sum, n) => sum + n, 0);
  const floorDays = report.filter(
    (r, i) => isBelowComfortFloor(expectedSeries[i].gas_m3, r.gas_m3)
  ).length;

  return {
    model, readings: report, expectedSeries, cumulative, rawNet, netByDay, floorDays,
    units: cumulativeUnits(expectedSeries, report),
    stage: stageFor(cumulative), progress: progressToNext(cumulative),
    health: treeHealth(
      report.map((r, i) => ({
        net: netSaving(expectedSeries[i], r),
        belowFloor: isBelowComfortFloor(expectedSeries[i].gas_m3, r.gas_m3),
      })),
      shieldsEarned(stageFor(cumulative).level)
    ),
  };
}

/**
 * Left drawer, opened from the hamburger. The demonstrator brief specifies a
 * drawer rather than the bottom tab bar Report 6 originally designed.
 *
 * Every entry keeps its text label - no icon-only navigation for a 50+ group
 * with limited digital confidence.
 */
function tabBar(activeId, lang) {
  // A detail screen keeps its parent lit, so the bar never goes blank
  // underneath you.
  const parent = BOTTOM_TABS.includes(activeId) ? activeId : 'profile';

  return '<nav class="tabbar" aria-label="' + (lang === 'en' ? 'Main' : 'Hoofdmenu') + '">'
    + BOTTOM_TABS.map((id) => {
      const tab = TABS.find((t) => t.id === id);
      const on = id === parent;
      return '<button class="tab' + (on ? ' active' : '') + '" data-tab="' + id + '"'
        + (on ? ' aria-current="page"' : '') + '>'
        + '<span class="tab-icon" aria-hidden="true">' + tab.icon + '</span>'
        + '<span class="tab-label">' + (tab[lang] || tab.nl) + '</span></button>';
    }).join('')
    + '</nav>';
}

/**
 * Watt's own words about the screen you are on, behind a small button in the

 * The introduction runs once and can be skipped. Someone who skipped it, or
 * sat through it and is still unsure on one screen, needs the explanation for

function infoSheet(screenId, title, lang) {

    + '<div class="sheet-watt" aria-hidden="true">' + batterySvg('happy') + '</div>'

    + say('Sluiten', 'Close', lang) + '">&times;</button></div>'

}

/**
 * NL/EN, in the header rather than only under Profile.
 *
 * Dutch is the product language, but the demonstrator is also read by DACS and
 * examiners, and the first screen anyone sees is the consent journey - which
 * sits in front of the Profile screen where the other toggle lives. Without

function languageSwitch(lang) {
  return '<div class="lang-switch">'
    + '<button class="chip' + (lang === 'nl' ? ' on' : '') + '" data-lang="nl"'
    + ' aria-label="Nederlands"' + (lang === 'nl' ? ' aria-current="true"' : '') + '>NL</button>'
    + '<button class="chip' + (lang === 'en' ? ' on' : '') + '" data-lang="en"'
    + ' aria-label="English"' + (lang === 'en' ? ' aria-current="true"' : '') + '>EN</button>'
    + '</div>';
}

/**
 * Back to the demonstration menu, top left, on every screen but the menu.
 *
 * The feedback note (§2) found that "Restart" suggested the whole demo would
 * be erased, when what a lost visitor wants is the overview. This returns to
 * the menu and erases nothing; a genuine reset lives on the menu itself.
 */
function menuButton(lang) {
  return '<button class="back-menu" data-menu-home aria-label="'
    + say('Terug naar het demo-menu', 'Back to the demonstration menu', lang) + '">'
    + '<span aria-hidden="true">&lsaquo;</span>'
    + '<span class="back-menu-label">' + say('Demo-menu', 'Demo menu', lang) + '</span></button>';
}

/**
 * Watt, top left next to the menu button, for anyone who wants the walk
 * again. The click is handled with the Profile replay: same handler, same
 * rule that the tour starts on the home screen.
 */
function wattButton(lang) {
  return '<button class="watt-button" data-replay-tour aria-label="'
    + say('Rondleiding van Watt opnieuw', 'Watt\u2019s walk-through again', lang) + '" title="'
    + say('Rondleiding opnieuw', 'Walk-through again', lang) + '">'
    + batterySvg('happy') + '</button>';
}

function header(title, lang) {
  return menuButton(lang)
    + wattButton(lang)
    + '<span class="header-title">' + title + '</span>'
    + languageSwitch(lang)
    + '<button class="info-button" data-help aria-label="'
    + say('Uitleg over dit scherm', 'About this screen', lang) + '">i</button>';
}

/** The header for the menu and the dashboard route. */
function accessHeader(lang, withBack) {
  return (withBack ? menuButton(lang) : '')
    + '<span class="header-title brand">' + BRAND.name + '</span>' + languageSwitch(lang);
}

function footerNote(app, lang) {
  const last = app.readings.at(-1).date;
  return '<p class="illustrative">'
    + (lang === 'en'
      ? 'Last reading ' + last + ' &mdash; data runs one day behind. All amounts are example values; there is no real P4 data yet.'
      : 'Laatste meting ' + last + ' &mdash; gegevens lopen een dag achter. Alle bedragen zijn voorbeeldwaarden; er is nog geen echte P4-data.')
    + '</p>';
}

/**
 * Mounts the phone app.
 *
 * `store` is the single source of truth for state, shared with the access
 * screens: the NL/EN switch in the header, the one on the Profile screen and
 * the language question on the first onboarding step must never disagree, so
 * none of them owns a copy.
 *
 * @param {object} store  { get(): state, set(next): void }
 */
function start(getApp, store) {
  const phone = document.getElementById('phone');
  const screen = document.getElementById('screen');
  const nav = document.getElementById('nav');
  const tabs = document.getElementById('tabs');
  const bar = document.getElementById('header');
  let active = 'home';
  let infoOpen = false;

  function effectiveSeason() {
    const state = store.get();
    if (state.season !== 'auto') return state.season;
    // 'auto' follows the calendar of the simulated demo date.
    const month = Number(getApp().readings.at(-1).date.slice(5, 7));
    if (month === 12) return 'christmas';
    if (month >= 6 && month <= 8) return 'summer';
    return null;
  }

  /**
   * Re-renders the active screen.
   *
   * Scroll position is kept unless the screen itself changed: ticking a
   * consent box or renaming the tree re-renders the whole screen, and jumping
   * back to the top each time would lose the reader's place mid-list.
   */
  function draw(resetScroll = false) {
    const state = store.get();
    const app = getApp();
    const offset = screen.scrollTop;
    // Larger text is a real setting, not a label: Report 6 validated 20px as
    // the default, and this is the way up from it for anyone who needs it.
    phone.dataset.large = state.largeText === true ? 'true' : 'false';
    app.season = effectiveSeason();
    const tab = TABS.find((t) => t.id === active);
    const title = tab[state.language] || tab.nl;
    bar.innerHTML = header(title, state.language);
    screen.innerHTML = tab.render(app, state, state.language) + footerNote(app, state.language);
    if (active === 'event-detection') mountEventDetection(screen);
    // Outside #screen, so the bar stays put while the content scrolls.
    tabs.innerHTML = tabBar(active, state.language);
    nav.innerHTML = infoOpen ? infoSheet(active, title, state.language) : '';
    screen.scrollTop = resetScroll ? 0 : offset;
  }

  function go(id) { active = id; infoOpen = false; draw(true); }

  phone.addEventListener('click', (event) => {
    // data-help, not data-open="info": "info" is also the Info screen's tab id,
    // and sharing it made this button swallow the link to that screen.
    if (event.target.closest('[data-help]')) { infoOpen = true; draw(); return; }
    if (event.target.closest('[data-close="help"]')) { infoOpen = false; draw(); return; }

    // Watt, on demand. His steps are anchored to elements on the home screen,
    // so go there first - replaying from Profile would point at nothing.
    if (event.target.closest('[data-replay-tour]')) {
      if (document.querySelector('.tour-layer')) return;
      go('home');
      mountTour(document.getElementById('stage'), store.get().language,
        () => store.set({ ...store.get(), tourDone: true }), { onScreen: go });
      return;
    }

    const tab = event.target.closest('[data-tab]')?.dataset.tab;
    if (tab) { go(tab); return; }

    // Cards and links open their detail screen.
    const open = event.target.closest('[data-open]')?.dataset.open;
    if (open) go(open);
  });

  // Consent can be withdrawn from Profile at any time, and the app keeps
  // working afterwards (handover Q10).
  screen.addEventListener('change', (event) => {
    const key = event.target.dataset?.consent;
    if (!key) return;
    store.set(setConsent(store.get(), key, event.target.checked));
  });

  screen.addEventListener('click', (event) => {
    const lang = event.target.closest('[data-lang]')?.dataset.lang;
    if (lang) { store.set({ ...store.get(), language: lang }); return; }

    const name = event.target.closest('[data-name]')?.dataset.name;
    if (name) { store.set({ ...store.get(), treeName: name }); return; }

    const season = event.target.closest('[data-season]')?.dataset.season;
    if (season) { store.set({ ...store.get(), season }); return; }

    const period = event.target.closest('[data-period]')?.dataset.period;
    if (period) { store.set({ ...store.get(), period }); return; }

    const filter = event.target.closest('[data-challenge]')?.dataset.challenge;
    if (filter) store.set({ ...store.get(), challengeFilter: filter });
    // [data-open] is handled by the phone listener above, which this bubbles to.
  });

  screen.addEventListener('change', (event) => {
    const setting = event.target.dataset?.setting;
    if (!setting) return;
    store.set({ ...store.get(), [setting]: event.target.checked });
  });

  // Free-text renaming, alongside the tappable suggestions: the tree-mascot
  // report asks for both, because typing is more effortful for this group.
  screen.addEventListener('change', (event) => {
    if (!('nameInput' in (event.target.dataset || {}))) return;
    const value = event.target.value.trim();
    if (!value) return;
    store.set({ ...store.get(), treeName: value });
  });

  draw(true);
  return { draw, go };
}

/**
 * Back to the very first screen, with nothing kept.
 *
 * Only the menu offers this, and it says what it does. Everywhere else the
 * top-left button returns to the menu and erases nothing. Notes live under
 * their own key and survive even this.
 */
function restartDemo() {
  try { window.localStorage.removeItem('woneco.state.v1'); } catch { /* ignore */ }
  window.location.reload();
}

/**
 * The resident the "resident app" entry shows: someone who has completed
 * sign-up and said yes. Without this the app would show analysis for a
 * resident whose consent screen says "no" - the very contradiction the
 * feedback note's §3.2 is about. Applied once; a visitor who then withdraws
 * consent in Profile keeps that choice.
 */
function demoPersona(state) {
  if (state.onboarded) return state;
  return {
    ...state,
    onboarded: true,
    consent: Object.fromEntries(CONSENT_ITEMS.map((item) => [item.key, true])),
  };
}

document.addEventListener('DOMContentLoaded', () => {
  const screen = document.getElementById('screen');
  try {
    let state = load(window.localStorage);
    const app = boot(state.profile);
    let appView = null;
    let drawNotesRef = null;
    const headerBar = document.getElementById('header');
    const tabs = document.getElementById('tabs');
    const nav = document.getElementById('nav');
    const stage = document.getElementById('stage');

    // Which surface owns the phone: 'menu', 'app' or 'dashboard'. The note's
    // three entry points, plus the menu they all return to.
    let view = 'menu';
    let picked = null;
    let journeyIndex = 0;
    let redrawView = () => {};
    const journeyPanel = document.getElementById('journey');

    const store = {
      get: () => state,
      set: (next) => {
        state = next;
        save(window.localStorage, state);
        redrawView();
        drawNotesRef?.();
      },
    };

    function clearOverlays() {
      document.querySelector('.tour-layer')?.remove();
      delete stage.dataset.tourActive;
      delete stage.dataset.journey;
      journeyPanel.innerHTML = '';
      nav.innerHTML = '';
    }

    /** True while the phone is showing the partners' choice, on either route. */
    function onDashboardScreen() {
      return view === 'dashboard' || (view === 'journey' && journeyStep(journeyIndex).screen === 'dashboard');
    }

    function drawDashboardScreen() {
      headerBar.innerHTML = accessHeader(state.language, true);
      screen.innerHTML = picked
        ? renderInstitutionalRole(roleById(picked), state.language)
        : renderInstitutionalChoice(state.language);
      tabs.innerHTML = '';
      screen.scrollTop = 0;
    }

    function showMenu() {
      view = 'menu';
      clearOverlays();
      redrawView = () => {
        headerBar.innerHTML = accessHeader(state.language, false);
        screen.innerHTML = renderMenu(state.language);
        tabs.innerHTML = '';
        screen.scrollTop = 0;
      };
      redrawView();
    }

    // "Straight to the home screen with free navigation" (note §5), and
    // Watt walks in behind you: a new resident meets him first, so whoever
    // opens the app as a resident meets him too. Skippable in one tap, and the
    // route skips him altogether - it only says he exists.
    function enterApp() {
      state = demoPersona(state);
      save(window.localStorage, state);
      view = 'app';
      if (!appView) appView = start(() => app, store);
      redrawView = () => appView.draw();
      appView.go('home');
      mountTour(stage, state.language,
        () => store.set({ ...store.get(), tourDone: true }), { onScreen: appView.go });
    }

    // "Straight to the choice between municipality and housing association,
    // with a permanent demonstration warning" (note §5).
    function enterDashboard() {
      view = 'dashboard';
      picked = null;
      clearOverlays();
      redrawView = drawDashboardScreen;
      redrawView();
    }

    // The executive route (note §5): five moments, each opening the screen it
    // is about, explained in the panels beside the phone rather than over it.
    function enterJourney() {
      state = demoPersona(state);
      save(window.localStorage, state);
      clearOverlays();
      view = 'journey';
      journeyIndex = 0;
      picked = null;
      if (!appView) appView = start(() => app, store);
      stage.dataset.journey = 'on';
      redrawView = () => {
        const step = journeyStep(journeyIndex);
        journeyPanel.innerHTML = renderJourneyPanel(step, journeyIndex, state.language);
        if (step.screen === 'dashboard') drawDashboardScreen();
        else appView.go(step.screen);
        // On a phone the text sits above the screen; a new moment starts at its text.
        window.scrollTo({ top: 0 });
      };
      redrawView();
    }

    journeyPanel.addEventListener('click', (event) => {
      const action = event.target.closest('[data-journey]')?.dataset.journey;
      if (action === 'menu') { showMenu(); return; }
      if (action === 'next') journeyIndex = Math.min(TOTAL_JOURNEY_STEPS - 1, journeyIndex + 1);
      if (action === 'back') journeyIndex = Math.max(0, journeyIndex - 1);
      if (action === 'next' || action === 'back') { picked = null; redrawView(); }
    });

    // On the header element itself, so it survives every redraw of its
    // contents and works on all three surfaces.
    headerBar.addEventListener('click', (event) => {
      if (event.target.closest('[data-menu-home]')) { showMenu(); return; }
      const lang = event.target.closest('[data-lang]')?.dataset.lang;
      if (lang && lang !== state.language) store.set({ ...state, language: lang });
    });

    screen.addEventListener('click', (event) => {
      if (event.target.closest('[data-restart]')) { restartDemo(); return; }

      const entry = event.target.closest('[data-menu]')?.dataset.menu;
      if (entry === 'app') { enterApp(); return; }
      if (entry === 'dashboard') { enterDashboard(); return; }
      if (entry === 'journey') { enterJourney(); return; }

      if (onDashboardScreen()) {
        const role = event.target.closest('[data-role]')?.dataset.role;
        if (role) { picked = role; redrawView(); return; }
        if (event.target.closest('[data-access-action="roles"]')) { picked = null; redrawView(); }
        return;
      }

      if (view === 'app' && event.target.closest('[data-replay-onboarding]')) {
        const journey = mountConsentJourney(screen, store, () => {
          redrawView = () => appView.draw();
          appView.go('profile');
        });
        redrawView = () => journey.draw();
      }
    });

    // The notes panel beside the phone, saved under its own key so restarting
    // the demo never throws away what someone typed.
    // Collapsed by default behind a small button (note §5): open, the panel
    // drew almost as much attention as the app. Its state is remembered.
    const side = document.getElementById('side');
    const NOTES_OPEN_KEY = 'evs.notes.open';
    const notesOpen = () => { try { return window.localStorage.getItem(NOTES_OPEN_KEY) === '1'; } catch { return false; } };
    const drawNotes = () => {
      const open = notesOpen();
      side.classList.toggle('open', open);
      side.innerHTML = '<button class="notes-toggle" data-notes-toggle aria-expanded="' + open + '">'
        + (open ? '&#9662; ' : '&#9656; ') + say('Notities', 'Notes', state.language) + '</button>'
        + (open ? renderNotes(loadNotes(window.localStorage), state.language) : '');
    };
    side.addEventListener('click', (event) => {
      if (!event.target.closest('[data-notes-toggle]')) return;
      try { window.localStorage.setItem(NOTES_OPEN_KEY, notesOpen() ? '0' : '1'); } catch { /* ignore */ }
      drawNotes();
    });
    side.addEventListener('input', (event) => {
      if ('notes' in (event.target.dataset || {})) saveNotes(window.localStorage, event.target.value);
    });
    drawNotesRef = drawNotes;
    drawNotes();

    showMenu();
  } catch (error) {
    screen.textContent = 'Opstartfout: ' + error.message;
    throw error;
  }
});

console.info(BRAND.name + ' demo date: ' + DEMO_TODAY);

</script>
</body>
</html>
